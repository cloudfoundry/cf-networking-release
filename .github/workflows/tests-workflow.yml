name: unit-integration-tests

on:
  push:
  pull_request_target:
    types:
    - labeled
env:
  MAPPING: |
    build_nats_server=src/code.cloudfoundry.org/vendor/github.com/nats-io/nats-server/v2
  FLAGS: |
    --keep-going
    --trace
    -r
    --fail-on-pending
    --randomize-all
    --nodes=7
    --race
    --timeout 30m
    --flake-attempts 2
  RUN_AS: root
  VERIFICATIONS: |
    verify_go repo/$DIR
    verify_go_version_match_bosh_release repo
    verify_gofmt repo/$DIR
    verify_govet repo/$DIR
    verify_staticcheck repo/$DIR
  FUNCTIONS: ""
  DB: ""
jobs:
  repo-clone:
    if: github.event.label.name == 'ready-to-run'
    runs-on: ubuntu-latest
    steps:
    - name: cf-networking-release-repo
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.ref }}
        submodules: recursive
        path: repo
    - name: Check out wg-appruntime code
      uses: actions/checkout@v4
      with:
        repository: cloudfoundry/wg-app-platform-runtime-ci
        path: ci
    - name: zip repo artifacts
      run: |
        tar -czf repo-artifact.tar.gz repo
        tar -czf ci-artifact.tar.gz ci
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: repo
        path: |
          repo-artifact.tar.gz
          ci-artifact.tar.gz
  template-tests:
    runs-on: ubuntu-latest
    needs: repo-clone
    container:
      image: us-central1-docker.pkg.dev/app-runtime-platform-wg/dockerhub-mirror/cloudfoundry/tas-runtime-build
      credentials:
        username: _json_key
        password: ${{ secrets.GCP_SERVICE_ACCOUNT_TAS_RUNTIME_BUILD_IMAGE_READER }}
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: repo
    - run: |
        tar -xzvf repo-artifact.tar.gz
        tar -xzvf ci-artifact.tar.gz
    - name: template-tests
      run: |
        "${GITHUB_WORKSPACE}"/ci/shared/tasks/run-tests-templates/task.bash
  test-on-mysql-5-7:
    runs-on: ubuntu-latest
    env:
      BUILD_IMAGE: us-central1-docker.pkg.dev/app-runtime-platform-wg/dockerhub-mirror/cloudfoundry/tas-runtime-mysql-5.7
    needs: repo-clone
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: repo
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_TAS_RUNTIME_BUILD_IMAGE_READER }}
    - name: Configure Docker to use gcloud
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        docker pull "$BUILD_IMAGE"
    - run: "tar -xzvf repo-artifact.tar.gz\ntar -xzvf ci-artifact.tar.gz \n"
    - name: policy-server-mysql
      env:
        DIR: src/code.cloudfoundry.org/policy-server
        DB: mysql
      run: |
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
  test-repos-withoutdb:
    runs-on: ubuntu-latest
    needs: repo-clone
    env:
      BUILD_IMAGE: us-central1-docker.pkg.dev/app-runtime-platform-wg/dockerhub-mirror/cloudfoundry/tas-runtime-build
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: repo
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_TAS_RUNTIME_BUILD_IMAGE_READER }}
    - name: Configure Docker to use gcloud
      run: "gcloud auth configure-docker us-central1-docker.pkg.dev\ndocker pull \"$BUILD_IMAGE\" \n"
    - run: |
        tar -xzvf repo-artifact.tar.gz
        tar -xzvf ci-artifact.tar.gz
    - name: bosh-dns-adapter
      env:
        DIR: src/code.cloudfoundry.org/bosh-dns-adapter
      run: |
        export DIR=$DIR
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
    - name: cf-pusher
      env:
        DIR: src/code.cloudfoundry.org/cf-pusher
      run: |
        export DIR=$DIR
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
    - name: garden-external-networker
      env:
        DIR: src/code.cloudfoundry.org/garden-external-networker
      run: |
        export DIR=$DIR
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
    - name: lib
      env:
        DIR: src/code.cloudfoundry.org/lib
      run: |
        export DIR=$DIR
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
    - name: service-discovery-controller
      env:
        DIR: src/code.cloudfoundry.org/service-discovery-controller
      run: |
        export DIR=$DIR
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
  test-on-postgres:
    runs-on: ubuntu-latest
    needs: repo-clone
    env:
      BUILD_IMAGE: us-central1-docker.pkg.dev/app-runtime-platform-wg/dockerhub-mirror/cloudfoundry/tas-runtime-postgres
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: repo
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_TAS_RUNTIME_BUILD_IMAGE_READER }}
    - name: Configure Docker to use gcloud
      run: "gcloud auth configure-docker us-central1-docker.pkg.dev\ndocker pull \"$BUILD_IMAGE\" \n"
    - run: |
        tar -xzvf repo-artifact.tar.gz
        tar -xzvf ci-artifact.tar.gz
    - name: policy-server-mysql
      env:
        DIR: src/code.cloudfoundry.org/policy-server
        DB: postgres
      run: |
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
  test-on-mysql-8-0:
    runs-on: ubuntu-latest
    needs: repo-clone
    env:
      BUILD_IMAGE: us-central1-docker.pkg.dev/app-runtime-platform-wg/dockerhub-mirror/cloudfoundry/tas-runtime-mysql-8.0
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: repo
    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_TAS_RUNTIME_BUILD_IMAGE_READER }}
    - name: Configure Docker to use gcloud
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        docker pull "$BUILD_IMAGE"
    - run: |
        tar -xzvf repo-artifact.tar.gz
        tar -xzvf ci-artifact.tar.gz
    - name: policy-server-mysql
      env:
        DIR: src/code.cloudfoundry.org/policy-server
        DB: mysql
      run: |
        ./repo/.github/helpers/test.bash ${{ github.workspace }} "$BUILD_IMAGE"
